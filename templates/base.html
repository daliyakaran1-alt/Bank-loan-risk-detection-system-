<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags for Google -->
    <title>FinSight | Enterprise Bank Loan Analytics</title>
    <meta name="description" content="FinSight is an enterprise-grade banking risk analytics platform using machine learning to evaluate loan applicant default probability in real-time.">
    <meta name="keywords" content="bank analytics, loan default prediction, banking risk, machine learning finance, FinSight, loan risk analytics">
    <meta name="author" content="FinSight AI">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ site_url }}{{ request.path }}">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="PASTE_YOUR_GOOGLE_VERIFICATION_CODE_HERE">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="FinSight | Enterprise Bank Loan Analytics">
    <meta property="og:description" content="Real-time banking risk analytics platform evaluating loan applicant default probability.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    <meta property="og:image" content="{{ site_url }}/assets/images/logo.png">
    <meta property="og:site_name" content="FinSight">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FinSight | Enterprise Bank Loan Analytics">
    <meta name="twitter:description" content="Real-time banking risk analytics platform evaluating loan applicant default probability.">
    <meta name="twitter:image" content="{{ site_url }}/assets/images/logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Animate.css for micro-animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#082567',
                            yellow: '#f3b600',
                            light: '#f4f7fc',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        .glass-nav { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RHBTM3VCR5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RHBTM3VCR5');
    </script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="w-full glass-nav sticky top-0 z-50 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="{{ url_for('landing') }}" class="flex-shrink-0 flex items-center transform transition duration-300 hover:scale-105">
                        <img class="h-16 w-auto object-contain" src="{{ url_for('static', filename='images/logo.png') }}" alt="FinSight Logo">
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="#" class="text-slate-500 hover:text-brand-blue font-medium transition-colors">Solutions</a>
                    <a href="#" class="text-slate-500 hover:text-brand-blue font-medium transition-colors">Platform</a>
                    <a href="{{ url_for('login') }}" class="text-brand-blue hover:text-blue-900 font-semibold px-4 py-2 transition-colors">Sign In</a>
                    <a href="{{ url_for('dashboard') }}" class="bg-brand-blue hover:bg-blue-900 text-white font-medium px-6 py-2.5 rounded-lg shadow-md hover:shadow-lg transform transition duration-200 hover:-translate-y-0.5">
                        View Dashboard
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <img class="h-12 w-auto object-contain grayscale opacity-60" src="{{ url_for('static', filename='images/logo.png') }}" alt="FinSight Logo">
                </div>
                <p class="text-center text-sm text-slate-500 font-medium">&copy; 2026 FinSight AI Analytics. Building the future of finance.</p>
            </div>
        </div>
    </footer>
</body>
</html>
